{% load static %}
<header class="header">
    <div class="breadcrumb">
        <span class="breadcrumb-active">Dashboard</span>
        <span>/</span>
        <span>总览面板</span>
    </div>
    <div class="header-right">
        <div class="header-item">
            <img src="{% static 'images/icon-market-status.svg' %}" width="14" height="14" alt="market">
            <span class="text-muted">A股交易中</span>
        </div>
        <div class="header-item text-muted">
            <img src="{% static 'images/icon-clock.svg' %}" width="14" height="14" alt="clock">
            <span id="date-display">----/--/-- --:--:--</span>
        </div>
        <div class="status-badge status-online">
            <img src="{% static 'images/icon-status.svg' %}" width="14" height="14" alt="status">
            <span>系统正常</span>
        </div>
    </div>
</header>
