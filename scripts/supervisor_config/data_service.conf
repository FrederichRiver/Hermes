[program:data_service]
command=/opt/application/venv/bin/python3 /opt/application/src/data_service.py
directory=/opt/application/src
autostart=true
autorestart=true
startretries=3
stopwaitsecs=10
user=root
environment=PYTHONUNBUFFERED="1",PATH="/usr/bin:/usr/local/bin"
stdout_logfile=/var/log/supervisor/data_service.out.log
stderr_logfile=/var/log/supervisor/data_service.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
