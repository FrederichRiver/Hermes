services:
  ubuntu_dev:
    build: 
      context: .
      network: host
    image: ubuntu_image
    restart: no
    container_name: ubuntu_server_1
    volumes:
      - /mnt/Milano/src_space:/opt/application/src
    dns:
      - 8.8.8.8
      - 114.114.114.114
      - 172.18.0.1
    networks:
      mysql_network:
        ipv4_address: 172.18.0.5
    # 引入外部环境变量
    env_file:
      - .env
      - .env.secrets
    environment:
      REDIS_URL: ${REDIS_URL:-redis://172.18.0.7:6379/0}
      REDIS_USERNAME: ${REDIS_USERNAME:?Set REDIS_USERNAME in the Compose environment}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the Compose environment}
      SERVER_NAME: ${SERVER_NAME:-Ubuntu_docker}
      MYSQL_HOST: ${MYSQL_HOST:-172.18.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-stock}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
      SMTP_RECIPIENT: ${SMTP_RECIPIENT:-}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-true}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}

networks:
  mysql_network:
    external: true

volumes:
  src_space:
    driver: local
    driver_opts:
      type: none
      device: /mnt/Milano/src_space
      o: bind