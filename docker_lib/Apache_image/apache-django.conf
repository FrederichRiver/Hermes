# WSGI 模块：通常由基础镜像或统一的 httpd.conf 来加载，避免在这里重复加载。
# 如果基础镜像没有提供 mod_wsgi，请在镜像层或 httpd.conf 中统一加载。
# LoadModule wsgi_module /usr/lib/apache2/modules/mod_wsgi.so

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # 静态文件目录映射（collectstatic 输出目录）
    Alias /static /var/www/html/staticfiles
    <Directory /var/www/html/staticfiles>
        Require all granted
    </Directory>

    # 媒体文件目录映射
    Alias /media /var/www/html/media
    <Directory /var/www/html/media>
        Require all granted
    </Directory>

    # WSGI 核心配置：确保你的 Django 项目位于 /var/www/html/application
    # 将 Django 应用挂载到根路径（/），使访问服务器 IP 即可访问动态首页。
    # 指定虚拟环境与项目路径（使用 /opt/venv）
    WSGIDaemonProcess application python-path=/var/www/html python-home=/opt/venv
    WSGIProcessGroup application
    WSGIScriptAlias / /var/www/html/application/wsgi.py

    # 确保 Django 使用正确的 settings 模块（与 manage.py 中一致）
    SetEnv DJANGO_SETTINGS_MODULE application.settings
    # 如果希望 mod_wsgi 使用虚拟环境中的 site-packages，可显式设置 PYTHONPATH
    SetEnv PYTHONPATH /var/www/html

    <Directory /var/www/html/application>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # 如果需要一个静态的首页文件（test.html），保留该文件在 /var/www/html
    # 并允许通过 /test.html 直接访问；同时设置默认索引为 test.html（仅在目录浏览时生效）
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        DirectoryIndex test.html index.html
        Require all granted
    </Directory>

</VirtualHost>