# NOTE: This repository previously used the official httpd layout (/usr/local/apache2).
# The project has been migrated to Debian/Ubuntu's apache2 layout (/etc/apache2).
# This file is retained for reference only and is not used by the containerized
# Ubuntu-based image. Apache2 on Debian/Ubuntu uses /etc/apache2/apache2.conf which
# includes /etc/apache2/mods-enabled, conf-enabled and sites-enabled directories.

# Example minimal /etc/apache2/apache2.conf content (for reference):
##
## This is a minimal example — the system package provides a complete config.
##
@include /etc/apache2/mods-enabled/*.load
@include /etc/apache2/mods-enabled/*.conf

User ${APACHE_RUN_USER:-www-data}
Group ${APACHE_RUN_GROUP:-www-data}

ServerAdmin you@example.com
DocumentRoot /var/www/html

<Directory /var/www/>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<IfModule mod_dir.c>
    DirectoryIndex index.html index.cgi index.pl index.php index.xhtml index.htm
</IfModule>

ErrorLog ${APACHE_LOG_DIR}/error.log
CustomLog ${APACHE_LOG_DIR}/access.log combined

@include /etc/apache2/conf-enabled/*.conf
@include /etc/apache2/sites-enabled/*.conf
