# 绑定监听（生产环境建议绑定内网IP）
bind 0.0.0.0

# 开启保护模式（生产环境必须设置密码）
protected-mode yes
# user default off
# include /run/redis-users.acl
# requirepass fred14great
user default on >default000password ~* +@all
user fred on >fred14great ~* +@all &*

# 持久化配置（事件数据建议开启）
appendonly yes
appendfsync everysec

# 内存管理（防止OOM）
maxmemory 1gb
maxmemory-policy allkeys-lru

# 客户端连接数
maxclients 10000

# TCP keepalive
tcp-keepalive 300

