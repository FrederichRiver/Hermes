services:
  Redis_service:
    build: 
      context: .
      network: host
    image: redis_image
    restart: no
    container_name: redis_server
    volumes:
      - redis_space:/opt/redis
    dns:
      - 8.8.8.8
      - 114.114.114.114
      - 172.18.0.1
    networks:
      mysql_network:
        ipv4_address: 172.18.0.7
    # 引入外部环境变量
    env_file:
      - .env

networks:
  mysql_network:
    external: true

volumes:
  redis_space:
    driver: local
    driver_opts:
      type: none
      device: /mnt/Milano/redis
      o: bind