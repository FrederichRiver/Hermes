services:
  Redis_service:
    build: 
      context: .
      dockerfile: Dockerfile
      # network: host
    image: redis_image
    restart: no
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - redis_space:/opt/redis
    dns:
      - 8.8.8.8
      - 114.114.114.114
      - 172.18.0.1
    networks:
      mysql_network:
        ipv4_address: 172.18.0.7
    # 引入外部环境变量
    env_file:
      - .env
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:?Set REDIS_USERNAME in the Compose environment}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the Compose environment}

networks:
  mysql_network:
    external: true

volumes:
  redis_space:
    name: redis_space
    driver: local
    driver_opts:
      type: none
      device: /mnt/Milano/redis_data
      o: bind