<div class="panel" id="position-panel" data-module-part="positions-table">
    <div class="panel-header">
        <h3 class="panel-title">当前持仓</h3>
        <div class="panel-controls">
            <select id="account-select" class="small-select"></select>
            <span class="text-muted" id="position-count">共 -- 只标的</span>
        </div>
    </div>
    <div class="table-responsive">
        <table class="data-table" id="position-table">
            <thead>
                <tr>
                    <th>代码</th>
                    <th>名称</th>
                    <th class="text-right">持仓</th>
                    <th class="text-right">均价</th>
                    <th class="text-right">现价</th>
                    <th class="text-right">盈亏</th>
                    <th class="text-right">市值</th>
                    <th class="text-right">权重</th>
                </tr>
            </thead>
            <tbody id="position-tbody">
                <tr class="position-empty"><td colspan="8" class="text-muted">正在加载持仓数据…</td></tr>
            </tbody>
        </table>
    </div>
    <div class="panel-footer" id="position-footer" style="text-align:center;padding:10px;">
        <button id="position-load-more" class="btn small" style="display:none;">加载更多</button>
    </div>
</div>
