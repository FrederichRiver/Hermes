<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Quant Trading</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/hermes.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- 侧边导航 -->
        {% include 'includes/sidebar.html' %}

        <!-- 主内容区 -->
        <div class="main">
            <!-- 顶部栏 -->
            {% include 'includes/header.html' %}

            <!-- Dashboard 内容 -->
            <main class="content" id="content">
                <!-- Module: 统计卡片 (Stat Cards) -->
                <section class="module" data-module="stat-cards" id="module-stat-cards">
                <div class="stat-grid" id="stat-cards">
                    <div class="panel stat-card skeleton">
                        <div class="skeleton-line w-16 mb-3"></div>
                        <div class="skeleton-line w-32 h-6 mb-2"></div>
                        <div class="skeleton-line w-20"></div>
                    </div>
                    <div class="panel stat-card skeleton">
                        <div class="skeleton-line w-16 mb-3"></div>
                        <div class="skeleton-line w-32 h-6 mb-2"></div>
                        <div class="skeleton-line w-20"></div>
                    </div>
                    <div class="panel stat-card skeleton">
                        <div class="skeleton-line w-16 mb-3"></div>
                        <div class="skeleton-line w-32 h-6 mb-2"></div>
                        <div class="skeleton-line w-20"></div>
                    </div>
                    <div class="panel stat-card skeleton">
                        <div class="skeleton-line w-16 mb-3"></div>
                        <div class="skeleton-line w-32 h-6 mb-2"></div>
                        <div class="skeleton-line w-20"></div>
                    </div>
                </div>
                </section>

                <!-- Module: 图表 + 行情 (Charts & Market Quotes) -->
                <section class="module" data-module="charts-market" id="module-charts-market">
                <div class="grid-row">
                    <div class="grid-col-2">
                        <div class="panel chart-panel" data-module-part="netvalue-chart">
                            <div class="panel-header">
                                <div>
                                    <h3 class="panel-title">净值曲线</h3>
                                    <p class="panel-subtitle">策略净值 vs 基准指数（日内）</p>
                                </div>
                                <div class="chart-legend">
                                    <span class="legend-item"><span class="legend-dot" style="background:#06b6d4"></span>策略净值</span>
                                    <span class="legend-item"><span class="legend-dot" style="background:#64748b"></span>基准指数</span>
                                </div>
                            </div>
                            <div class="chart-container">
                                <canvas id="netValueChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="grid-col-1">
                        <div class="panel" id="market-quotes" data-module-part="market-quotes">
                            <div class="panel-header">
                                <h3 class="panel-title">自选行情</h3>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                            </div>
                            <div class="quote-list" id="quote-list">
                                <div class="quote-item skeleton"><div class="skeleton-line w-full h-8"></div></div>
                                <div class="quote-item skeleton"><div class="skeleton-line w-full h-8"></div></div>
                                <div class="quote-item skeleton"><div class="skeleton-line w-full h-8"></div></div>
                                <div class="quote-item skeleton"><div class="skeleton-line w-full h-8"></div></div>
                            </div>
                        </div>
                    </div>
                </div>
                </section>

                <!-- Module: 持仓表格 (Positions) -->
                <section class="module" data-module="positions" id="module-positions">
                {% include 'includes/positions.html' %}
                </section>

                <!-- Module: 信号 + 风控 (Signals & Risk) -->
                <section class="module" data-module="signals-risk" id="module-signals-risk">
                <div class="grid-row">
                    <div class="grid-col-1">
                        <div class="panel" id="signal-panel" data-module-part="signals">
                            <div class="panel-header">
                                <h3 class="panel-title">交易信号 / 系统日志</h3>
                            </div>
                            <div class="signal-list" id="signal-list">
                                <div class="signal-item skeleton"><div class="skeleton-line w-full h-12"></div></div>
                                <div class="signal-item skeleton"><div class="skeleton-line w-full h-12"></div></div>
                                <div class="signal-item skeleton"><div class="skeleton-line w-full h-12"></div></div>
                            </div>
                        </div>
                    </div>
                    <div class="grid-col-1">
                        <div class="panel" id="risk-panel" data-module-part="risk">
                            <div class="panel-header">
                                <div class="flex items-center gap-2">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                                    <h3 class="panel-title">风控监控</h3>
                                </div>
                                <span class="badge-live">RiskAgent LIVE</span>
                            </div>
                            <div class="risk-list" id="risk-list">
                                <div class="risk-item skeleton"><div class="skeleton-line w-full h-8"></div></div>
                                <div class="risk-item skeleton"><div class="skeleton-line w-full h-8"></div></div>
                                <div class="risk-item skeleton"><div class="skeleton-line w-full h-8"></div></div>
                            </div>
                            <div class="risk-summary" id="risk-summary">
                                <div class="skeleton-line w-full h-8"></div>
                            </div>
                        </div>
                    </div>
                </div>
                </section>
            </main>
        </div>
    </div>

    <script src="{% static 'js/hermes.js' %}"></script>
</body>
</html>
